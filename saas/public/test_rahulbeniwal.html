<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
/* ================================================
   rahulbeniwal Template — Project-Forward Portfolio
   Inspired by: Rahulbeniwal/portfolio (Astro)
   ================================================ */

*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

:root {
  --bg: #08080c;
  --bg-surface: #101018;
  --accent: #e8ff58;
  --accent-dim: rgba(232,255,88,0.12);
  --text: #ededf4;
  --text-dim: #7878a0;
  --border: rgba(255,255,255,0.07);
  --radius: 16px;
  --transition: 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  --container: 1200px;
}

html { scroll-behavior: smooth; }

body {
  font-family: 'Space Grotesk', 'Inter', sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  overflow-x: hidden;
}

/* ── LAYOUT ─────────────────────────────────── */
.container {
  max-width: var(--container);
  margin: 0 auto;
  padding: 0 32px;
}

/* ── NAV ────────────────────────────────────── */
.nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 100;
  padding: 20px 40px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  backdrop-filter: blur(12px);
  background: rgba(8,8,12,0.75);
  border-bottom: 1px solid var(--border);
}
.nav-logo {
  font-size: 1rem;
  font-weight: 800;
  color: var(--text);
  text-decoration: none;
  letter-spacing: -0.02em;
}
.nav-links {
  display: flex;
  gap: 6px;
  list-style: none;
}
.nav-links a {
  color: var(--text-dim);
  text-decoration: none;
  font-size: 0.82rem;
  font-weight: 500;
  padding: 6px 14px;
  border-radius: 40px;
  transition: var(--transition);
}
.nav-links a:hover { color: var(--text); }
@media (max-width: 768px) { .nav-links { display: none; } }

/* ── HERO ───────────────────────────────────── */
.hero {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  padding: 0 0 80px;
  position: relative;
}
.hero-label {
  font-size: 0.72rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 3px;
  color: var(--accent);
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.hero-label::before {
  content: '';
  display: inline-block;
  width: 32px; height: 1px;
  background: var(--accent);
}
.hero-name {
  font-size: clamp(3.5rem, 9vw, 7.5rem);
  font-weight: 800;
  line-height: 0.95;
  letter-spacing: -0.03em;
  margin-bottom: 28px;
  color: var(--text);
}
.hero-tagline {
  font-size: clamp(1rem, 2.5vw, 1.4rem);
  font-weight: 400;
  color: var(--text-dim);
  max-width: 560px;
  line-height: 1.6;
  margin-bottom: 40px;
}
.hero-meta {
  display: flex;
  gap: 32px;
  flex-wrap: wrap;
}
.hero-meta-item {
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.hero-meta-label {
  font-size: 0.65rem;
  text-transform: uppercase;
  letter-spacing: 2px;
  color: var(--text-dim);
  font-weight: 600;
}
.hero-meta-value {
  font-size: 0.88rem;
  font-weight: 700;
  color: var(--text);
}
.hero-scroll {
  position: absolute;
  bottom: 40px;
  right: 40px;
  font-size: 0.72rem;
  color: var(--text-dim);
  display: flex;
  align-items: center;
  gap: 8px;
  animation: bounce 2.5s ease-in-out infinite;
}
@keyframes bounce {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(6px); }
}

/* ── SECTIONS ───────────────────────────────── */
.section { padding: 100px 0; }
.section + .section { border-top: 1px solid var(--border); }
.section-header { margin-bottom: 56px; }
.section-label {
  font-size: 0.72rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 2px;
  color: var(--accent);
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.section-title {
  font-size: clamp(2rem, 4vw, 3rem);
  font-weight: 800;
  letter-spacing: -0.02em;
  line-height: 1.1;
  color: var(--text);
}

/* ── ABOUT / BIO ────────────────────────────── */
.about-grid {
  display: grid;
  grid-template-columns: 1fr 1.2fr;
  gap: 60px;
  align-items: start;
}
.about-image {
  aspect-ratio: 3/4;
  border-radius: var(--radius);
  overflow: hidden;
  position: relative;
}
.about-image img {
  width: 100%; height: 100%;
  object-fit: cover;
}
.about-image::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, transparent 60%, rgba(8,8,12,0.8));
}
.about-text {
  font-size: 1.05rem;
  line-height: 1.9;
  color: var(--text-dim);
  padding-top: 8px;
}
.about-text p + p { margin-top: 18px; }
@media (max-width: 768px) { .about-grid { grid-template-columns: 1fr; } }

/* ── PROJECTS (BIG CARDS) ──────────────────── */
.projects-list { display: flex; flex-direction: column; gap: 3px; }
.project-item {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  transition: var(--transition);
  background: var(--bg-surface);
  min-height: 320px;
}
.project-item:hover {
  border-color: var(--accent);
  transform: scale(1.005);
  box-shadow: 0 20px 60px rgba(0,0,0,0.4);
}
.project-visual {
  background: linear-gradient(135deg, rgba(232,255,88,0.06), rgba(232,255,88,0.02));
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 40px;
  position: relative;
  overflow: hidden;
}
.project-visual::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse at center, rgba(232,255,88,0.08) 0%, transparent 70%);
}
.project-visual-icon { font-size: 4rem; opacity: 0.7; }
.project-info { padding: 40px; display: flex; flex-direction: column; justify-content: center; gap: 16px; }
.project-number {
  font-size: 0.65rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 2px;
  color: var(--accent);
}
.project-name {
  font-size: 1.6rem;
  font-weight: 800;
  letter-spacing: -0.02em;
  color: var(--text);
  line-height: 1.2;
}
.project-summary {
  font-size: 0.88rem;
  color: var(--text-dim);
  line-height: 1.7;
}
.project-tags { display: flex; flex-wrap: wrap; gap: 6px; }
.project-tag {
  font-size: 0.68rem;
  font-weight: 700;
  padding: 3px 10px;
  border-radius: 40px;
  background: var(--accent-dim);
  color: var(--accent);
  letter-spacing: 0.5px;
}
.project-link {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  color: var(--text);
  text-decoration: none;
  font-size: 0.82rem;
  font-weight: 700;
  transition: var(--transition);
  margin-top: 8px;
}
.project-link:hover { gap: 14px; color: var(--accent); }

/* alternate layout for every other project */
.project-item:nth-child(even) .project-visual { order: 2; }
.project-item:nth-child(even) .project-info { order: 1; }

@media (max-width: 768px) {
  .project-item { grid-template-columns: 1fr; }
  .project-item:nth-child(even) .project-visual { order: 0; }
}

/* ── ADDITIONAL PROJECTS (GRID) ─────────────── */
.mini-projects {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 12px;
}
.mini-project {
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px 22px;
  transition: var(--transition);
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
}
.mini-project:hover { border-color: rgba(232,255,88,0.3); transform: translateY(-2px); }
.mini-project-name { font-size: 0.88rem; font-weight: 700; color: var(--text); }
.mini-project-desc { font-size: 0.75rem; color: var(--text-dim); margin-top: 4px; line-height: 1.5; }
.mini-project-arrow { color: var(--text-dim); transition: var(--transition); flex-shrink: 0; }
.mini-project:hover .mini-project-arrow { color: var(--accent); transform: translate(2px,-2px); }

/* ── SKILLS ─────────────────────────────────── */
.skills-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 2px;
}
.skill-category {
  padding: 24px 20px;
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  transition: var(--transition);
}
.skill-category:hover { border-color: rgba(232,255,88,0.3); }
.skill-cat-label {
  font-size: 0.65rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 2px;
  color: var(--accent);
  margin-bottom: 12px;
}
.skill-items { display: flex; flex-wrap: wrap; gap: 6px; }
.skill-item {
  font-size: 0.78rem;
  padding: 4px 10px;
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text-dim);
}

/* ── OPEN SOURCE ────────────────────────────── */
.os-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
.os-item {
  padding: 24px;
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  transition: var(--transition);
}
.os-item:hover { border-color: rgba(232,255,88,0.3); transform: translateY(-2px); }
.os-name { font-size: 0.92rem; font-weight: 800; color: var(--text); margin-bottom: 6px; }
.os-desc { font-size: 0.78rem; color: var(--text-dim); line-height: 1.6; margin-bottom: 12px; }
.os-lang {
  font-size: 0.68rem;
  font-weight: 700;
  color: var(--accent);
  background: var(--accent-dim);
  padding: 2px 8px;
  border-radius: 4px;
  display: inline-block;
  margin-right: 8px;
}
.os-stars { font-size: 0.68rem; color: var(--text-dim); }

/* ── EXPERIENCE ─────────────────────────────── */
.exp-list { display: flex; flex-direction: column; gap: 2px; }
.exp-item {
  display: grid;
  grid-template-columns: 160px 1fr;
  gap: 40px;
  padding: 32px 0;
  border-bottom: 1px solid var(--border);
  align-items: start;
}
.exp-item:last-child { border-bottom: none; }
.exp-date { font-size: 0.78rem; color: var(--accent); font-weight: 700; font-family: monospace; padding-top: 3px; }
.exp-role { font-size: 1.05rem; font-weight: 800; color: var(--text); margin-bottom: 4px; }
.exp-company { font-size: 0.85rem; color: var(--text-dim); font-weight: 600; margin-bottom: 10px; }
.exp-desc { font-size: 0.85rem; color: var(--text-dim); line-height: 1.7; }
@media (max-width: 600px) { .exp-item { grid-template-columns: 1fr; gap: 8px; } }

/* ── CONTACT ────────────────────────────────── */
.contact-grid {
  display: grid;
  grid-template-columns: 1.5fr 1fr;
  gap: 60px;
  align-items: start;
}
.contact-heading {
  font-size: clamp(2rem, 5vw, 4rem);
  font-weight: 800;
  letter-spacing: -0.03em;
  line-height: 1.1;
  margin-bottom: 20px;
  color: var(--text);
}
.contact-sub {
  font-size: 0.95rem;
  color: var(--text-dim);
  line-height: 1.7;
  margin-bottom: 32px;
}
.contact-links { display: flex; flex-direction: column; gap: 12px; }
.contact-link {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px 18px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  text-decoration: none;
  color: var(--text);
  font-size: 0.88rem;
  font-weight: 600;
  transition: var(--transition);
}
.contact-link:hover {
  border-color: var(--accent);
  color: var(--accent);
  background: var(--accent-dim);
}
.contact-link-icon {
  width: 38px; height: 38px;
  border-radius: 10px;
  background: rgba(255,255,255,0.05);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.contact-info { display: flex; flex-direction: column; gap: 16px; }
.contact-info-item { display: flex; flex-direction: column; gap: 2px; }
.contact-info-label { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 2px; color: var(--text-dim); font-weight: 700; }
.contact-info-value { font-size: 0.88rem; color: var(--text); font-weight: 600; }
@media (max-width: 768px) { .contact-grid { grid-template-columns: 1fr; } }

/* ── FOOTER ────────────────────────────────── */
.footer {
  padding: 40px 0;
  border-top: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.footer-text { font-size: 0.78rem; color: var(--text-dim); }
.footer-socials { display: flex; gap: 10px; }
.footer-social {
  width: 36px; height: 36px;
  border: 1px solid var(--border);
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-dim);
  text-decoration: none;
  transition: var(--transition);
}
.footer-social:hover { border-color: var(--accent); color: var(--accent); }

/* ── UTILITIES ─────────────────────────────── */
.accent { color: var(--accent); }
[data-theme="light"] {
  --bg: #fafaf8;
  --bg-surface: #f2f2f0;
  --text: #1a1a1e;
  --text-dim: #6a6a7a;
  --border: rgba(0,0,0,0.08);
}
</style>
</head>
